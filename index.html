<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VERDÉ Botanica Shampoo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="product-card">

        <!-- PRODUCT IMAGE -->
        <div class="product-image">

            <span class="product-badge">NEW</span>

            <!-- Decorative leaves -->
            <div class="leaf leaf-1">🌿</div>
            <div class="leaf leaf-2">🌿</div>

            <!-- Shampoo Bottle -->
            <div class="bottle">

                <div class="bottle-cap"></div>

                <div class="bottle-body">

                    <p class="brand">VERDÉ</p>

                    <div class="line"></div>

                    <span class="product-name">BOTANICA</span>

                    <small>REPAIR SHAMPOO</small>

                    <div class="bottle-leaf">✦</div>

                </div>

            </div>

        </div>


        <!-- PRODUCT INFORMATION -->
        <div class="product-info">

            <p class="category">BOTANICAL HAIR CARE</p>

            <h1>
                BOTANICA<br>
                <span>SHAMPOO</span>
            </h1>

            <p class="description">
                A gentle botanical formula infused with aloe,
                rosemary and green tea for healthier-looking hair.
            </p>


            <!-- FEATURES -->
            <div class="features">

                <span>🌿 Aloe</span>
                <span>🍃 Rosemary</span>
                <span>✦ Sulfate Free</span>

            </div>


            <!-- PRICE & RATING -->
            <div class="price-section">

                <div>
                    <small>PRICE</small>
                    <p class="price">₹699</p>
                </div>

                <div class="rating">
                    ★ 4.8
                </div>

            </div>


            <!-- BUTTON -->
            <button class="buy-btn">
                ADD TO CART →
            </button>

        </div>

    </main>

</body>
</html>
