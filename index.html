<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VERDANT - After Dark</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="product-card">

        <!-- MUSIC VISUAL -->
        <div class="event-image">

            <span class="event-badge">LIVE</span>

            <div class="orb">
                <div class="orb-inner"></div>
            </div>

            <div class="music-symbol">♫</div>

            <div class="sound-waves">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- EVENT INFORMATION -->
        <div class="event-info">

            <p class="category">ELECTRONIC EXPERIENCE</p>

            <h1>
                VERDANT<br>
                <span>AFTER DARK</span>
            </h1>

            <p class="description">
                Where sound meets the night. 
                Lose yourself in music, lights and endless energy.
            </p>


            <!-- EVENT DETAILS -->
            <div class="event-details">

                <div>
                    <small>DATE</small>
                    <p>28 JUL 2027</p>
                </div>

                <div>
                    <small>LOCATION</small>
                    <p>KOCHI</p>
                </div>

            </div>


            <!-- TICKET -->
            <div class="ticket-section">

                <div>
                    <small>ENTRY PASS</small>
                    <p class="price">₹999</p>
                </div>

                <div class="rating">
                    ★ 4.9
                </div>

            </div>


            <!-- BUTTON -->
            <button class="entry-btn">
                GET YOUR PASS →
            </button>

        </div>

    </main>

</body>
</html>
